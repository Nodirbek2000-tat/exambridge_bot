# ExamBridge Telegram bot.
# Sayt bilan bitta tarmoqda (exambridge_net) ishlaydi va unga http://web:8000 orqali ulanadi.
# Ishga tushirish: docker compose up -d --build

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - exambridge_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  exambridge_net:
    external: true
